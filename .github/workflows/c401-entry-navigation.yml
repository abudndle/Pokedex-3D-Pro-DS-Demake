name: C401 entry navigation and save integrity
on:
  pull_request:
    paths: ['source/**', 'tests/*c401*', 'tests/run_c260_melonds_fat.sh', 'Makefile*', '.github/workflows/c401-entry-navigation.yml']
  push:
    branches: [main, 'codex/c401-entry-navigation']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c401-entry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  entry-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify native entry controller and fail-closed acceptance gates
        run: |
          sh tests/run_c401_entry_navigation.sh
          python3 -m unittest discover -s tests -p 'test_c401_entry_gate.py' -v
      - name: Build only owner-authored long Move Dex data into the development ROM
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          python3 tests/c360_synthetic_moves.py "$stage"
          docker run --rm -v "$PWD:/work" -v "$stage:/c401-fixture:ro" -w /work \
            skylyrac/blocksds:slim-latest \
            make -f Makefile.native NITROFSDIR=/c401-fixture rom EXTRA_CFLAGS=-DP3D_EMULATOR_DIAGNOSTICS
          python3 tests/verify_nds_rom.py Pokedex3D_DS_BlocksDS.nds
      - name: Obtain official SHA-pinned melonDS 1.1 AppImage
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          echo "C260_MELONDS_ROOT=$temp" >> "$GITHUB_ENV"
          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/melonDS-emu/melonDS/releases/download/1.1/melonDS-1.1-appimage-x86_64.zip' \
            -o "$temp/melonds.zip"
          printf '%s  %s\n' 'bf377420a2e95f2cd2cdda17d5372b51c2534f858b038db9ec6d129554875124' "$temp/melonds.zip" | sha256sum -c -
          unzip -q "$temp/melonds.zip" -d "$temp"
          app="$(find "$temp" -maxdepth 3 -type f -name '*.AppImage' -print -quit)"
          test -n "$app"
          chmod +x "$app"
          (cd "$temp" && "$app" --appimage-extract >/dev/null)
          test -x "$temp/squashfs-root/AppRun"
          echo "C260_APP_RUN=$temp/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Install independent virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-apps x11-utils xdotool libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Verify Favorites and Recent opens, same-move bookmark reset and repeated FAT restarts
        shell: bash
        run: |
          C401_ENTRY_ONLY=1 xvfb-run -a -s '-screen 0 1024x768x24' timeout 480s \
            bash tests/run_c260_melonds_fat.sh "$PWD/Pokedex3D_DS_BlocksDS.nds" "$C260_APP_RUN"
      - name: Preserve synthetic-only entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c401-entry-synthetic-evidence
          path: |
            c401-melonds-*.xwd
            c260-melonds-windows.txt
          if-no-files-found: ignore
          retention-days: 3
