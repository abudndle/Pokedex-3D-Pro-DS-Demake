name: Native BlocksDS smoke ROM
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-rom:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile asset-free native Nintendo DS ROM
        run: make dev-rom EXTRA_CFLAGS=-DP3D_EMULATOR_DIAGNOSTICS
      - name: Inspect generated ROM
        run: |
          test -s Pokedex3D_DS_BlocksDS.nds
          ls -lh Pokedex3D_DS_BlocksDS.nds
      - uses: actions/upload-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: Pokedex3D_DS_BlocksDS.nds
          if-no-files-found: error

  verify-rom:
    needs: native-rom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: verified-rom
      - name: Validate ROM header and ARM7/ARM9 sections
        run: python3 tests/verify_nds_rom.py verified-rom/Pokedex3D_DS_BlocksDS.nds

  emulator-smoke:
    needs: native-rom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: emulator-rom
      - name: Install Nintendo DS emulator and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y desmume xvfb x11-apps x11-utils xdotool
      - name: Attempt ROM startup in DeSmuME CLI
        shell: bash
        run: |
          set -euo pipefail
          test -s emulator-rom/Pokedex3D_DS_BlocksDS.nds
          echo "C152 asset-free development ROM SHA-256:"
          sha256sum emulator-rom/Pokedex3D_DS_BlocksDS.nds
          echo "DeSmuME CLI installed version:"
          /usr/games/desmume-cli --version || true
          cat > /tmp/check_emulator.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/games/desmume-cli --disable-sound emulator-rom/Pokedex3D_DS_BlocksDS.nds >/tmp/desmume.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          # Give NitroFS/FAT startup and the DS CPU more time to draw frames.
          # Record the early hardware palette probe and the later menu.
          window_id=""
          for attempt in $(seq 1 20); do
            xwininfo -root -tree > emulator-windows.txt
            window_id="$(awk '/"Desmume/{print $1; exit}' emulator-windows.txt)"
            if [ -n "$window_id" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          test -n "$window_id" || { cat /tmp/desmume.log; echo "No emulator window"; exit 1; }
          xwd -id "$window_id" -silent -out emulator-early.xwd
          test -s emulator-early.xwd
          # Wait until the home menu is present, then compare before/after input.
          sleep 12
          xwd -id "$window_id" -silent -out emulator-before-open.xwd
          # SDL may ignore XSendEvent targeted at a window. Focus the
          # emulator and use XTEST keyboard injection instead.
          xdotool windowfocus --sync "$window_id"
          # The old click at upper-screen (128,190) left KEY_TOUCH held in
          # real C152 ARM9 diagnostics, potentially swallowing later inputs.
          # Keyboard focus is already confirmed by X11; release the mouse
          # without injecting any new touchscreen press.
          xdotool mouseup 1
          # C152 real ARM9 probe showed this installed CLI maps the X11
          # Down symbol to KEY_LID (0x2000), which freezes later input
          # calibration. Open the initially selected Pokédex with A only.
          # Never inject Down/Up before verifying this frontend's key map.
          # DeSmuME's current CLI source (src/frontend/posix/cli/main.cpp)
          # maps x=A and z=B. The older Linux manpage is outdated.
          xdotool keydown x
          sleep 1
          xdotool keyup x
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-open.xwd
          # Verify the X11 focus still belongs to the SDL emulator window.
          # The upstream CLI key map uses x=A, z=B and arrow keys as D-Pad.
          {
            echo "Expected SDL DeSmuME CLI keys: x=A, z=B, Right=D-Pad Right"
            echo "Emulator X11 window: $window_id"
            echo "Focused X11 window: $(xdotool getwindowfocus)"
            echo "ROM SHA256: $(sha256sum emulator-rom/Pokedex3D_DS_BlocksDS.nds)"
          } > emulator-input-diagnostics.txt
          # Distinguish a frozen game loop from an unmapped B key:
          # The installed CLI's Right mapping must be proven by the ARM9 probe.
          xdotool keydown Right
          sleep 0.4
          xwd -id "$window_id" -silent -out emulator-during-right.xwd
          xdotool keyup Right
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-right.xwd
          xdotool keydown z
          sleep 0.5
          xwd -id "$window_id" -silent -out emulator-during-back.xwd
          sleep 0.5
          xdotool keyup z
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-back.xwd
          # Temporary C152 calibration: installed CLI may remap keyboard
          # symbols unexpectedly. Capture the ACTUAL ARM9 held-bit readout
          # for each candidate while it is down, never infer from key names.
          for candidate in z w q s a Right Left Up Down; do
            xdotool keydown "$candidate"
            sleep 0.35
            xwd -id "$window_id" -silent -out "probe-$candidate.xwd"
            xdotool keyup "$candidate"
            sleep 0.15
          done
          sleep 1
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/desmume.log
            echo "DeSmuME terminated before the startup smoke test completed" >&2
            exit 1
          fi
          # Capture both emulated screens for manual review in CI artifacts.
          # This is evidence, not an automated proof of correct rendering.
          xwininfo -root -tree > emulator-windows.txt
          cat emulator-windows.txt
          window_id="$(awk '/"Desmume/{print $1; exit}' emulator-windows.txt)"
          test -n "$window_id" || { echo "No DeSmuME window detected"; exit 1; }
          xwd -id "$window_id" -silent -out emulator-window.xwd
          test -s emulator-window.xwd
          tail -30 /tmp/desmume.log || true
          SCRIPT
          chmod +x /tmp/check_emulator.sh
          xvfb-run -a -s '-screen 0 1024x768x24' timeout 50s /tmp/check_emulator.sh
      - name: Reject mostly blank emulator display
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          raw=Path('emulator-window.xwd').read_bytes()
          h=struct.unpack_from('>25I',raw)
          header, width, height, bpl, colors=h[0],h[4],h[5],h[12],h[19]
          assert h[3] in (24,32) and h[11] in (24,32), (
              f'Unsupported XWD pixel format: depth={h[3]}, bits_per_pixel={h[11]}')
          pixel_stride=h[11]//8
          offset=header+colors*12
          assert len(raw)>=offset+bpl*height, 'Truncated XWD capture'
          pixels=memoryview(raw)[offset:offset+bpl*height]
          # Sample only the 256x384 emulator window, not the black desktop.
          colored=0
          total=0
          unique=set()
          per_screen=[set(),set()]
          for y in range(0,height,4):
              for x in range(0,width,4):
                  p=y*bpl+pixel_stride*x
                  rgb=tuple(pixels[p:p+3])
                  colored+=max(rgb)>16
                  total+=1
                  unique.add(rgb)
                  per_screen[0 if y<height//2 else 1].add(rgb)
          ratio=colored/total
          print(f'Visible nonblack window pixels: {ratio:.1%}; '
                f'unique colors: {len(unique)}; '
                f'upper/lower colors: {[len(v) for v in per_screen]}')
          assert ratio>=0.05, 'Emulator window is mostly black'
          # The menu uses monochrome console text. Count color diversity
          # as a diagnostic, but white text on black is valid gameplay.
          assert len(per_screen[0])>=2, 'Upper DS console is blank'
          assert len(per_screen[1])>=2, 'Lower DS menu is blank'
          assert len(unique)>=3, 'Both DS screens appear blank'
          PY
      - name: Compare menu frames around simulated input
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          def read_pixels(path):
              b=Path(path).read_bytes()
              h=struct.unpack_from('>25I',b)
              offset=h[0]+h[19]*12
              stride=h[11]//8
              return set(),b[offset:offset+h[12]*h[5]],h[4],h[5],h[12],stride
          _,a,w,h,row,stride=read_pixels('emulator-before-open.xwd')
          _,b,w2,h2,row2,stride2=read_pixels('emulator-after-open.xwd')
          assert (w,h,row,stride)==(w2,h2,row2,stride2)
          different=sum(a[y*row+x*stride:y*row+x*stride+3] !=
                        b[y*row+x*stride:y*row+x*stride+3]
                        for y in range(0,h,2) for x in range(0,w,2))
          print(f'Menu input changed {different} sampled pixels')
          _,right,wright,hright,rowright,strideright=read_pixels('emulator-after-right.xwd')
          assert (w,h,row,stride)==(wright,hright,rowright,strideright)
          moved=sum(b[y*row+x*stride:y*row+x*stride+3] !=
                    right[y*row+x*stride:y*row+x*stride+3]
                    for y in range(0,h,2) for x in range(0,w,2))
          print(f'Pokédex Right input changed {moved} sampled pixels')
          # Only tiny heartbeat text changes were observed (5 pixels);
          # that is not sufficient evidence of Pokémon browsing.
          assert moved>100, (
              'C152 FAIL: Right did not visibly browse an entry; inspect '
              'during-right capture, SDL focus and game input state')
          assert different>100, (
              'Simulated Down/A sequence did not visibly open a menu page')
          _,c,w3,h3,row3,stride3=read_pixels('emulator-after-back.xwd')
          assert (w,h,row,stride)==(w3,h3,row3,stride3)
          restored=sum(a[y*row+x*stride:y*row+x*stride+3] !=
                       c[y*row+x*stride:y*row+x*stride+3]
                       for y in range(0,h,2) for x in range(0,w,2))
          print(f'After B, pixels different from home menu: {restored}')
          assert restored<different//2, (
              'C152 FAIL: B (z per upstream DeSmuME CLI mapping) did not '
              'restore home. Inspect held-key capture and emulator focus.')
          PY
      - name: Upload emulator visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desmume-startup-evidence
          path: |
            emulator-window.xwd
            emulator-early.xwd
            emulator-before-open.xwd
            emulator-after-open.xwd
            emulator-input-diagnostics.txt
            emulator-after-right.xwd
            emulator-during-right.xwd
            emulator-after-back.xwd
            emulator-during-back.xwd
            emulator-windows.txt
            probe-*.xwd
          if-no-files-found: warn
