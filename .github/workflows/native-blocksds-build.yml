name: Native BlocksDS smoke ROM
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-rom:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile asset-free native Nintendo DS ROM
        run: make dev-rom
      - name: Inspect generated ROM
        run: |
          test -s Pokedex3D_DS_BlocksDS.nds
          ls -lh Pokedex3D_DS_BlocksDS.nds
      - uses: actions/upload-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: Pokedex3D_DS_BlocksDS.nds
          if-no-files-found: error

  verify-rom:
    needs: native-rom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: verified-rom
      - name: Validate ROM header and ARM7/ARM9 sections
        run: python3 tests/verify_nds_rom.py verified-rom/Pokedex3D_DS_BlocksDS.nds

  emulator-smoke:
    needs: native-rom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: emulator-rom
      - name: Install Nintendo DS emulator and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y desmume xvfb x11-apps x11-utils
      - name: Attempt ROM startup in DeSmuME CLI
        shell: bash
        run: |
          set -euo pipefail
          test -s emulator-rom/Pokedex3D_DS_BlocksDS.nds
          cat > /tmp/check_emulator.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/games/desmume-cli --disable-sound emulator-rom/Pokedex3D_DS_BlocksDS.nds >/tmp/desmume.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          # Give NitroFS/FAT startup and the DS CPU more time to draw frames.
          # Record the early hardware palette probe and the later menu.
          sleep 1
          xwininfo -root -tree > emulator-windows.txt
          window_id="$(awk '/"Desmume/{print $1; exit}' emulator-windows.txt)"
          if [ -n "$window_id" ]; then
            xwd -id "$window_id" -silent -out emulator-early.xwd
          fi
          sleep 19
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/desmume.log
            echo "DeSmuME terminated before the startup smoke test completed" >&2
            exit 1
          fi
          # Capture both emulated screens for manual review in CI artifacts.
          # This is evidence, not an automated proof of correct rendering.
          xwininfo -root -tree > emulator-windows.txt
          cat emulator-windows.txt
          window_id="$(awk '/"Desmume/{print $1; exit}' emulator-windows.txt)"
          test -n "$window_id" || { echo "No DeSmuME window detected"; exit 1; }
          xwd -id "$window_id" -silent -out emulator-window.xwd
          test -s emulator-window.xwd
          tail -30 /tmp/desmume.log || true
          SCRIPT
          chmod +x /tmp/check_emulator.sh
          xvfb-run -a -s '-screen 0 1024x768x24' timeout 35s /tmp/check_emulator.sh
      - name: Reject mostly blank emulator display
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          raw=Path('emulator-window.xwd').read_bytes()
          h=struct.unpack_from('>25I',raw)
          header, width, height, bpl, colors=h[0],h[4],h[5],h[12],h[19]
          assert h[3] in (24,32) and h[11] in (24,32), (
              f'Unsupported XWD pixel format: depth={h[3]}, bits_per_pixel={h[11]}')
          pixel_stride=h[11]//8
          offset=header+colors*12
          assert len(raw)>=offset+bpl*height, 'Truncated XWD capture'
          pixels=memoryview(raw)[offset:offset+bpl*height]
          # Sample only the 256x384 emulator window, not the black desktop.
          colored=0
          total=0
          unique=set()
          per_screen=[set(),set()]
          for y in range(0,height,4):
              for x in range(0,width,4):
                  p=y*bpl+pixel_stride*x
                  rgb=tuple(pixels[p:p+3])
                  colored+=max(rgb)>16
                  total+=1
                  unique.add(rgb)
                  per_screen[0 if y<height//2 else 1].add(rgb)
          ratio=colored/total
          print(f'Visible nonblack window pixels: {ratio:.1%}; '
                f'unique colors: {len(unique)}; '
                f'upper/lower colors: {[len(v) for v in per_screen]}')
          assert ratio>=0.05, 'Emulator window is mostly black'
          assert len(unique)>=8 and all(len(v)>=4 for v in per_screen), (
              'Emulator shows a blank/solid-color DS screen, not visible gameplay')
          PY
      - name: Upload emulator visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desmume-startup-evidence
          path: |
            emulator-window.xwd
            emulator-early.xwd
            emulator-windows.txt
          if-no-files-found: warn
