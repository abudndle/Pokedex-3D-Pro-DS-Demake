name: Native BlocksDS smoke ROM
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-rom:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile asset-free native Nintendo DS ROM
        run: make dev-rom
      - name: Inspect generated ROM
        run: |
          test -s Pokedex3D_DS_BlocksDS.nds
          ls -lh Pokedex3D_DS_BlocksDS.nds
      - uses: actions/upload-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: Pokedex3D_DS_BlocksDS.nds
          if-no-files-found: error

  verify-rom:
    needs: native-rom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: verified-rom
      - name: Validate ROM header and ARM7/ARM9 sections
        run: python3 tests/verify_nds_rom.py verified-rom/Pokedex3D_DS_BlocksDS.nds

  emulator-smoke:
    needs: native-rom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: emulator-rom
      - name: Install Nintendo DS emulator and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y desmume xvfb x11-apps x11-utils x11-xserver-utils xdotool openbox
      - name: Attempt ROM startup in DeSmuME CLI
        shell: bash
        run: |
          set -euo pipefail
          test -s emulator-rom/Pokedex3D_DS_BlocksDS.nds
          /usr/games/desmume-cli --version || true
          sha256sum emulator-rom/Pokedex3D_DS_BlocksDS.nds
          echo "DeSmuME CLI key bindings: x=A, z=B, arrow keys=D-Pad (DeSmuME SDL CLI source)."
          cat > /tmp/check_emulator.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          # SDL under headless Xvfb can lose foreground keyboard ownership
          # without a window manager. Use Openbox for real focus negotiation.
          openbox >/tmp/openbox.log 2>&1 &
          wm_pid=$!
          /usr/games/desmume-cli --disable-sound emulator-rom/Pokedex3D_DS_BlocksDS.nds >/tmp/desmume.log 2>&1 &
          pid=$!
          trap 'kill "$pid" "$wm_pid" 2>/dev/null || true' EXIT
          # Give NitroFS/FAT startup and the DS CPU more time to draw frames.
          # Record the early hardware palette probe and the later menu.
          window_id=""
          for attempt in $(seq 1 20); do
            xwininfo -root -tree > emulator-windows.txt
            window_id="$(awk '/"Desmume/{print $1; exit}' emulator-windows.txt)"
            if [ -n "$window_id" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          test -n "$window_id" || { cat /tmp/desmume.log; echo "No emulator window"; exit 1; }
          xwd -id "$window_id" -silent -out emulator-early.xwd
          test -s emulator-early.xwd
          # Wait until the home menu is present, then compare before/after input.
          sleep 12
          xwd -id "$window_id" -silent -out emulator-before-down.xwd
          # SDL may ignore XSendEvent targeted at a window. Focus the
          # emulator and use XTEST keyboard injection instead.
          xdotool windowactivate --sync "$window_id"
          xdotool windowfocus --sync "$window_id"
          # Do not click the touchscreen to focus: that can change the game.
          # XTEST key events are directed to the focused SDL CLI window.
          xdotool mousemove --window "$window_id" 128 190
          # Observe X11 key delivery on the actual SDL window without
          # assuming that an XTEST event reached DeSmuME's key map.
          xev -id "$window_id" -event keyboard > emulator-xev.log 2>&1 &
          xev_pid=$!
          echo "Focused DeSmuME SDL window: $window_id"
          echo "X11 active: $(xdotool getactivewindow) focused: $(xdotool getwindowfocus)"
          xmodmap -pke | grep -E 'Right|Down| z | s ' | head -15 || true
          # Send the source-verified DeSmuME SDL CLI bindings while
          # collecting evidence. Keyboard layout and emulator bindings
          # differ between frontends, so no gameplay claim is implied.
          xdotool keydown Down
          sleep 1
          xdotool keyup Down
          # DeSmuME's current CLI source (src/frontend/posix/cli/main.cpp)
          # maps x=A and z=B. The older Linux manpage is outdated.
          xdotool keydown x
          sleep 1
          xdotool keyup x
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-down.xwd
          # Distinguish a frozen game loop from an unmapped B key:
          # Right should browse from Pokémon #001 to #002 on this page.
          xdotool windowactivate --sync "$window_id"
          xdotool windowfocus --sync "$window_id"
          xdotool keydown Right
          sleep 1
          xdotool keyup Right
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-right.xwd
          xdotool windowactivate --sync "$window_id"
          xdotool windowfocus --sync "$window_id"
          xdotool keydown z
          sleep 1
          xwd -id "$window_id" -silent -out emulator-during-back.xwd
          sleep 0.5
          xdotool keyup z
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-back.xwd
          # Diagnostic-only: test whether the emulator/game accepts ANY
          # later button after Right/B; X should open Search from Pokédex.
          xdotool windowfocus --sync "$window_id"
          xdotool keydown s
          sleep 0.6
          xdotool keyup s
          sleep 1
          xwd -id "$window_id" -silent -out emulator-after-x-probe.xwd
          xdotool keydown x
          sleep 0.6
          xdotool keyup x
          sleep 1
          xwd -id "$window_id" -silent -out emulator-after-a-probe.xwd
          # Compare with an actual DS touchscreen bottom-right browse tap.
          # This isolates keyboard injection from native Pokédex navigation.
          xdotool mousemove --window "$window_id" 224 360
          xdotool click 1
          sleep 1
          xwd -id "$window_id" -silent -out emulator-after-touch-probe.xwd
          echo "X11 focus after probes: $(xdotool getwindowfocus)"
          echo "X11 keypress events on the SDL window:"
          grep -E 'KeyPress|KeyRelease|keysym' emulator-xev.log | tail -65 || true
          kill "$xev_pid" 2>/dev/null || true
          xmodmap -pke | grep -E 'Right|Down| z | s ' | head -15 || true
          sleep 1
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/desmume.log
            echo "DeSmuME terminated before the startup smoke test completed" >&2
            exit 1
          fi
          # Capture both emulated screens for manual review in CI artifacts.
          # This is evidence, not an automated proof of correct rendering.
          xwininfo -root -tree > emulator-windows.txt
          cat emulator-windows.txt
          window_id="$(awk '/"Desmume/{print $1; exit}' emulator-windows.txt)"
          test -n "$window_id" || { echo "No DeSmuME window detected"; exit 1; }
          xwd -id "$window_id" -silent -out emulator-window.xwd
          test -s emulator-window.xwd
          tail -30 /tmp/desmume.log || true
          SCRIPT
          chmod +x /tmp/check_emulator.sh
          xvfb-run -a -s '-screen 0 1024x768x24' timeout 50s /tmp/check_emulator.sh
      - name: Reject mostly blank emulator display
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          raw=Path('emulator-window.xwd').read_bytes()
          h=struct.unpack_from('>25I',raw)
          header, width, height, bpl, colors=h[0],h[4],h[5],h[12],h[19]
          assert h[3] in (24,32) and h[11] in (24,32), (
              f'Unsupported XWD pixel format: depth={h[3]}, bits_per_pixel={h[11]}')
          pixel_stride=h[11]//8
          offset=header+colors*12
          assert len(raw)>=offset+bpl*height, 'Truncated XWD capture'
          pixels=memoryview(raw)[offset:offset+bpl*height]
          # Sample only the 256x384 emulator window, not the black desktop.
          colored=0
          total=0
          unique=set()
          per_screen=[set(),set()]
          for y in range(0,height,4):
              for x in range(0,width,4):
                  p=y*bpl+pixel_stride*x
                  rgb=tuple(pixels[p:p+3])
                  colored+=max(rgb)>16
                  total+=1
                  unique.add(rgb)
                  per_screen[0 if y<height//2 else 1].add(rgb)
          ratio=colored/total
          print(f'Visible nonblack window pixels: {ratio:.1%}; '
                f'unique colors: {len(unique)}; '
                f'upper/lower colors: {[len(v) for v in per_screen]}')
          assert ratio>=0.05, 'Emulator window is mostly black'
          # The menu uses monochrome console text. Count color diversity
          # as a diagnostic, but white text on black is valid gameplay.
          assert len(per_screen[0])>=2, 'Upper DS console is blank'
          assert len(per_screen[1])>=2, 'Lower DS menu is blank'
          assert len(unique)>=3, 'Both DS screens appear blank'
          PY
      - name: Report diagnostic post-entry X/A input probes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.emulator_transition_check import load_xwd,differences
          def changed(a,b):
              return sum(differences(load_xwd(Path(a)),load_xwd(Path(b))))
          print("B to X probe changed pixels:",changed('emulator-after-back.xwd','emulator-after-x-probe.xwd'))
          print("X to A probe changed pixels:",changed('emulator-after-x-probe.xwd','emulator-after-a-probe.xwd'))
          print("A to touch-right probe changed pixels:",changed('emulator-after-a-probe.xwd','emulator-after-touch-probe.xwd'))
          PY
      - name: Assert A, Right and B transitions from actual DeSmuME frames
        run: |
          python3 tools/emulator_transition_check.py \
            --home emulator-before-down.xwd \
            --dex emulator-after-down.xwd \
            --next emulator-after-right.xwd \
            --returned emulator-after-back.xwd
      - name: Upload emulator visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desmume-startup-evidence
          path: |
            emulator-window.xwd
            emulator-early.xwd
            emulator-before-down.xwd
            emulator-after-down.xwd
            emulator-after-right.xwd
            emulator-after-back.xwd
            emulator-during-back.xwd
            emulator-after-x-probe.xwd
            emulator-after-a-probe.xwd
            emulator-after-touch-probe.xwd
            emulator-xev.log
            emulator-windows.txt
          if-no-files-found: warn
