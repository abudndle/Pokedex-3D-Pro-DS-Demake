name: Native BlocksDS smoke ROM
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-blocksds-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-rom:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile asset-free native Nintendo DS ROM
        run: make dev-rom EXTRA_CFLAGS=-DP3D_EMULATOR_DIAGNOSTICS
      # Setup uses GitHub's Python toolcache instead of apt inside the
      # BlocksDS container. apt DNS/package-mirror failures previously stopped
      # the build after ndstool had already produced a valid native ROM.
      - name: Provide Python runtime for C273 packaging gate
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python runtime is usable
        run: |
          python3 --version
          python3 -c 'import hashlib, pathlib, subprocess, tempfile; print("C273 Python prerequisites OK")'
      - name: C273 compile and unpack isolated synthetic private diagnostic ROM
        run: python3 tests/c273_native_private_rom_gate.py
      - name: Inspect generated ROM
        run: |
          test -s Pokedex3D_DS_BlocksDS.nds
          ls -lh Pokedex3D_DS_BlocksDS.nds
      - uses: actions/upload-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: Pokedex3D_DS_BlocksDS.nds
          if-no-files-found: error

  verify-rom:
    needs: native-rom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: verified-rom
      - name: Validate ROM header and ARM7/ARM9 sections
        run: python3 tests/verify_nds_rom.py verified-rom/Pokedex3D_DS_BlocksDS.nds

  emulator-smoke:
    needs: native-rom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-ds-smoke-rom
          path: emulator-rom
      - name: Install Nintendo DS emulator and virtual display
        shell: bash
        run: |
          set -euo pipefail
          # Mirror/DNS failures must not keep an emulator acceptance job stuck.
          # Retry transient failures, then fail explicitly; never skip the test.
          sudo DEBIAN_FRONTEND=noninteractive timeout 150s apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo DEBIAN_FRONTEND=noninteractive timeout 180s apt-get install -y \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            --no-install-recommends desmume xvfb x11-apps x11-utils xdotool strace
          # Ubuntu installs the CLI in /usr/games, which is not guaranteed
          # to be present in the non-login Actions runner PATH.
          # Check the exact executable used by the following smoke step.
          test -x /usr/games/desmume-cli
          command -v Xvfb
          command -v xdotool
      - name: Attempt ROM startup in DeSmuME CLI
        shell: bash
        run: |
          set -euo pipefail
          test -s emulator-rom/Pokedex3D_DS_BlocksDS.nds
          cat > /tmp/check_emulator.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          # C236: DeSmuME 0.9.13 reads [KEYS] from XDG_CONFIG_HOME/desmume/config.
          # Use explicit SDL2 keycodes in a fresh isolated config, never
          # runner/user defaults or the incompatible SDL1 arrow constants.
          export XDG_CONFIG_HOME="$(mktemp -d)"
          python3 tools/c236_desmume_keymap.py --xdg-config-home "$XDG_CONFIG_HOME"
          echo "Installed DeSmuME package:"
          dpkg-query -W desmume
          # The installed 0.9.13 CLI has a verified u32/u16 default-key
          # memcpy mismatch and resets parsed [KEYS] to those bad defaults.
          # The test-only LD_PRELOAD remaps SDL key events, not DS memory.
          case "$(dpkg-query -W -f='${Version}' desmume)" in
            0.9.13-*) ;;
            *) echo "Unsupported DeSmuME keymap ABI; fail closed" >&2; exit 1 ;;
          esac
          # C238 draft-only diagnostic: trace the *actual* SDL2 event keysyms
          # and GLib [KEYS] lookup results without modifying game input.
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            tests/c238_sdl_event_trace.c -ldl -o /tmp/c238_sdl_event_trace.so
          strace -f -e trace=openat -o /tmp/desmume-open.log \
            env LD_PRELOAD=/tmp/c238_sdl_event_trace.so P3D_C238_TRACE=1 P3D_C240_ADAPT_0913=1 \
            /usr/games/desmume-cli --disable-sound emulator-rom/Pokedex3D_DS_BlocksDS.nds >/tmp/desmume.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          # Give NitroFS/FAT startup and the DS CPU more time to draw frames.
          # Record the early hardware palette probe and the later menu.
          window_id=""
          for attempt in $(seq 1 20); do
            xwininfo -root -tree > emulator-windows.txt
            window_id="$(awk '/"Desmume/{print $1; exit}' emulator-windows.txt)"
            if [ -n "$window_id" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          test -n "$window_id" || { cat /tmp/desmume.log; echo "No emulator window"; exit 1; }
          xwd -id "$window_id" -silent -out emulator-early.xwd
          test -s emulator-early.xwd
          # Wait until the home menu is present, then compare before/after input.
          sleep 12
          xwd -id "$window_id" -silent -out emulator-home.xwd
          # SDL may ignore XSendEvent targeted at a window. Focus the
          # emulator and use XTEST keyboard injection instead.
          xdotool windowfocus --sync "$window_id"
          # C235: the native HOME's first highlighted entry is Pokédex.
          # Never send Down (which selects Move Dex) or a mouse click
          # (which can independently trigger a touchscreen menu action).
          # C239 isolated [KEYS] maps x=A, d=Right and b=B.
          # No source/asset game code or user-visible DS keymap changes.
          xdotool keydown x
          sleep 0.5
          xdotool keyup x
          sleep 2
          xwd -id "$window_id" -silent -out emulator-dex.xwd
          # Distinguish a frozen game loop from an unmapped B key:
          # Right should browse from Pokémon #001 to #002 on this page.
          xdotool keydown d
          sleep 0.25
          xwd -id "$window_id" -silent -out emulator-during-right.xwd
          sleep 0.25
          xdotool keyup d
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-right.xwd
          # Diagnostic only: a second A on Dex toggles Favorite, proving
          # whether the emulator loop accepts *any* later keypad event.
          xdotool keydown x
          sleep 0.4
          xdotool keyup x
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-second-a.xwd
          xdotool keydown b
          sleep 0.5
          xwd -id "$window_id" -silent -out emulator-during-back.xwd
          sleep 0.5
          xdotool keyup b
          sleep 2
          xwd -id "$window_id" -silent -out emulator-after-back.xwd
          # C243: deliberate lower-touchscreen hitbox for HOME entry #2
          # (Move Dex): DS touch y=88+16+8=112, window y=192+112=304.
          # This is a touchscreen test, NOT a claim that CLI Down works.
          xdotool mousemove --window "$window_id" 110 304
          # Hold through several VBlanks so SDL cannot miss the touch edge.
          xdotool mousedown 1
          sleep 0.4
          xdotool mouseup 1
          sleep 2
          xwd -id "$window_id" -silent -out emulator-move-dex.xwd
          xdotool keydown b
          sleep 0.4
          xdotool keyup b
          sleep 2
          xwd -id "$window_id" -silent -out emulator-move-back.xwd
          # AR Viewer is HOME index 5. On DS it must stay visible but
          # disabled: touch selects it; A must NOT open a camera page.
          # Touch y=88+5*16+8=176, window y=368.
          xdotool mousemove --window "$window_id" 110 368
          # Hold through several VBlanks so SDL cannot miss the touch edge.
          xdotool mousedown 1
          sleep 0.4
          xdotool mouseup 1
          sleep 2
          xwd -id "$window_id" -silent -out emulator-ar-selected.xwd
          xdotool keydown x
          sleep 0.4
          xdotool keyup x
          sleep 2
          xwd -id "$window_id" -silent -out emulator-ar-after-a.xwd
          # C235 diagnostic: inspect alternate X11 keysyms on the still-open
          # Dex page, without treating any candidate as verified mapping.
          for candidate in KP_Right d l z c v b s; do
            xdotool keydown "$candidate"
            sleep 0.25
            xdotool keyup "$candidate"
            sleep 0.5
            xwd -id "$window_id" -silent -out "emulator-probe-$candidate.xwd"
          done
          # C237: capture the actual ARM9 keymask for every printable
          # candidate while it is held. This is temporary draft-only CI
          # evidence; do not infer mappings from key names or merge on it.
          for candidate in q w e r t y u i o p a s d f g h j k l z x c v b n m; do
            xdotool keydown "$candidate"
            sleep 0.3
            xwd -id "$window_id" -silent -out "emulator-keyscan-$candidate.xwd"
            xdotool keyup "$candidate"
            sleep 0.1
          done
          # Archive only numeric diagnostic lines, never private config paths.
          grep '^C238 ' /tmp/desmume.log > emulator-input-trace.log || true
          echo "C238 actual SDL/GLib input trace:"
          cat emulator-input-trace.log
          echo "DeSmuME XDG config open evidence:"
          grep -E '/desmume/config|\\.desmume\\.ini' /tmp/desmume-open.log | tail -8 || true
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/desmume.log
            echo "DeSmuME terminated before the startup smoke test completed" >&2
            exit 1
          fi
          # Capture both emulated screens for manual review in CI artifacts.
          # This is evidence, not an automated proof of correct rendering.
          xwininfo -root -tree > emulator-windows.txt
          cat emulator-windows.txt
          window_id="$(awk '/"Desmume/{print $1; exit}' emulator-windows.txt)"
          test -n "$window_id" || { echo "No DeSmuME window detected"; exit 1; }
          xwd -id "$window_id" -silent -out emulator-window.xwd
          test -s emulator-window.xwd
          tail -30 /tmp/desmume.log || true
          SCRIPT
          chmod +x /tmp/check_emulator.sh
          xvfb-run -a -s '-screen 0 1024x768x24' timeout 100s /tmp/check_emulator.sh
      - name: Reject mostly blank emulator display
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          raw=Path('emulator-window.xwd').read_bytes()
          h=struct.unpack_from('>25I',raw)
          header, width, height, bpl, colors=h[0],h[4],h[5],h[12],h[19]
          assert h[3] in (24,32) and h[11] in (24,32), (
              f'Unsupported XWD pixel format: depth={h[3]}, bits_per_pixel={h[11]}')
          pixel_stride=h[11]//8
          offset=header+colors*12
          assert len(raw)>=offset+bpl*height, 'Truncated XWD capture'
          pixels=memoryview(raw)[offset:offset+bpl*height]
          # Sample only the 256x384 emulator window, not the black desktop.
          colored=0
          total=0
          unique=set()
          per_screen=[set(),set()]
          for y in range(0,height,4):
              for x in range(0,width,4):
                  p=y*bpl+pixel_stride*x
                  rgb=tuple(pixels[p:p+3])
                  colored+=max(rgb)>16
                  total+=1
                  unique.add(rgb)
                  per_screen[0 if y<height//2 else 1].add(rgb)
          ratio=colored/total
          print(f'Visible nonblack window pixels: {ratio:.1%}; '
                f'unique colors: {len(unique)}; '
                f'upper/lower colors: {[len(v) for v in per_screen]}')
          assert ratio>=0.05, 'Emulator window is mostly black'
          # The menu uses monochrome console text. Count color diversity
          # as a diagnostic, but white text on black is valid gameplay.
          assert len(per_screen[0])>=2, 'Upper DS console is blank'
          assert len(per_screen[1])>=2, 'Lower DS menu is blank'
          assert len(unique)>=3, 'Both DS screens appear blank'
          PY
      - name: Verify A opens Dex, Right advances, and B returns home
        run: python3 tests/c235_emulator_frame_gate.py emulator-home.xwd emulator-dex.xwd emulator-after-right.xwd emulator-after-back.xwd
      - name: Verify touchscreen Move Dex and disabled DS AR Viewer
        run: |
          python3 tests/c243_emulator_menu_gate.py \
            emulator-after-back.xwd emulator-move-dex.xwd \
            emulator-move-back.xwd emulator-ar-selected.xwd \
            emulator-ar-after-a.xwd
      - name: Generate readable PNG captures and exact asset-free ROM/source SHA manifest
        run: |
          python3 tests/c242_emulator_evidence.py \
            --rom emulator-rom/Pokedex3D_DS_BlocksDS.nds \
            --commit "$(git rev-parse HEAD)" \
            --output emulator-evidence \
            emulator-home.xwd emulator-dex.xwd \
            emulator-after-right.xwd emulator-after-back.xwd \
            emulator-move-dex.xwd emulator-move-back.xwd \
            emulator-ar-selected.xwd emulator-ar-after-a.xwd
          test -s emulator-evidence/manifest.json
      - name: Upload emulator visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desmume-startup-evidence
          path: |
            emulator-window.xwd
            emulator-early.xwd
            emulator-home.xwd
            emulator-dex.xwd
            emulator-after-right.xwd
            emulator-during-right.xwd
            emulator-after-second-a.xwd
            emulator-after-back.xwd
            emulator-move-dex.xwd
            emulator-move-back.xwd
            emulator-ar-selected.xwd
            emulator-ar-after-a.xwd
            emulator-during-back.xwd
            emulator-probe-*.xwd
            emulator-keyscan-*.xwd
            emulator-windows.txt
            emulator-input-trace.log
            emulator-evidence/*.png
            emulator-evidence/manifest.json
          if-no-files-found: warn
