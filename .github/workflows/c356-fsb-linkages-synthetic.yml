name: C356 original FSB linkage sites (synthetic only)
on:
  push:
    branches: [main, "feat/**"]
    paths:
      - 'tools/c356_fsb_linkage_sites.py'
      - 'tests/test_c356_fsb_linkage_sites.py'
      - '.github/workflows/c356-fsb-linkages-synthetic.yml'
  pull_request:
    paths:
      - 'tools/c356_fsb_linkage_sites.py'
      - 'tests/test_c356_fsb_linkage_sites.py'
      - '.github/workflows/c356-fsb-linkages-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c356-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-original-fsb-linkage-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source-only FSB linkage tests
        run: |
          python3 -m unittest discover -s tests -p 'test_c356_fsb_linkage_sites.py' -v
          python3 -m py_compile tools/c356_fsb_linkage_sites.py
