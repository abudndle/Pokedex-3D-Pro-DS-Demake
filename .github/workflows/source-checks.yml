name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project documentation
        run: |
          test -s README.md
          test -s docs/PROJECT_HANDOFF.md
          test -s docs/MODEL_RESTORATION_STATUS.md
      - name: C318 release evidence positive and negative regressions
        run: |
          python3 tests/test_c318_release_evidence.py
          python3 tools/check_feature_parity.py
      - name: Check Python scripts if present
        run: |
          python3 - <<'PY'
          import compileall
          from pathlib import Path
          scripts = Path("tools")
          if scripts.is_dir():
              assert compileall.compile_dir(str(scripts), quiet=1), "Python syntax check failed"
          print("Source check passed; native ROM build not configured yet.")
          PY
