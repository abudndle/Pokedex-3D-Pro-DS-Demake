name: C403 full descriptions and source-bound resume
on:
  pull_request:
    paths: ['source/**', 'tests/*c403*', 'tests/run_c260_melonds_fat.sh', 'Makefile*', '.github/workflows/c403-descriptions.yml']
  push:
    branches: [main, 'codex/c403-complete-descriptions']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c403-description-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  description-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete text paging and fail-closed resume gates
        run: |
          sh tests/run_c403_description.sh
          sh tests/run_c403_description_resume.sh
          python3 -m unittest discover -s tests -p 'test_c403_description_gate.py' -v
      - name: Build only owner-authored descriptions into the development ROM
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          python3 tests/c403_synthetic_descriptions.py "$stage"
          baseline="$(mktemp -d)"
          git fetch --no-tags --depth=1 origin a683dec76c8067c5d21b288e2f487e41b09c580a
          git archive FETCH_HEAD | tar -x -C "$baseline"
          docker run --rm -v "$baseline:/work" -v "$stage:/c403-fixture:ro" -w /work \
            skylyrac/blocksds:slim-latest \
            make -f Makefile.native NITROFSDIR=/c403-fixture rom EXTRA_CFLAGS=-DP3D_EMULATOR_DIAGNOSTICS
          cp "$baseline/Pokedex3D_DS_BlocksDS.nds" "$RUNNER_TEMP/c403-under-test.nds"
          docker run --rm -v "$PWD:/work" -v "$stage:/c403-fixture:ro" -w /work \
            skylyrac/blocksds:slim-latest \
            make -f Makefile.native NITROFSDIR=/c403-fixture rom EXTRA_CFLAGS=-DP3D_EMULATOR_DIAGNOSTICS
          python3 tests/verify_nds_rom.py Pokedex3D_DS_BlocksDS.nds
          cp Pokedex3D_DS_BlocksDS.nds "$RUNNER_TEMP/c403-original.nds"
          python3 tests/c403_synthetic_descriptions.py "$stage" changed
          docker run --rm -v "$PWD:/work" -v "$stage:/c403-fixture:ro" -w /work \
            skylyrac/blocksds:slim-latest \
            make -f Makefile.native NITROFSDIR=/c403-fixture rom EXTRA_CFLAGS=-DP3D_EMULATOR_DIAGNOSTICS
          cp Pokedex3D_DS_BlocksDS.nds "$RUNNER_TEMP/c403-changed.nds"
      - name: Obtain official SHA-pinned melonDS 1.1 AppImage
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          echo "C260_MELONDS_ROOT=$temp" >> "$GITHUB_ENV"
          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/melonDS-emu/melonDS/releases/download/1.1/melonDS-1.1-appimage-x86_64.zip' \
            -o "$temp/melonds.zip"
          printf '%s  %s\n' 'bf377420a2e95f2cd2cdda17d5372b51c2534f858b038db9ec6d129554875124' "$temp/melonds.zip" | sha256sum -c -
          unzip -q "$temp/melonds.zip" -d "$temp"
          app="$(find "$temp" -maxdepth 3 -type f -name '*.AppImage' -print -quit)"
          test -n "$app"
          chmod +x "$app"
          (cd "$temp" && "$app" --appimage-extract >/dev/null)
          test -x "$temp/squashfs-root/AppRun"
          echo "C260_APP_RUN=$temp/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Install independent virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-apps x11-utils xdotool libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Confirm old production ROM fails the same complete-description acceptance
        shell: bash
        run: |
          set +e
          C403_DESCRIPTION_ONLY=1 C403_CHANGED_ROM="$RUNNER_TEMP/c403-changed.nds" xvfb-run -a -s '-screen 0 1024x768x24' timeout 480s \
            bash tests/run_c260_melonds_fat.sh "$RUNNER_TEMP/c403-under-test.nds" "$C260_APP_RUN" > c403-baseline-rejection.log 2>&1
          status=$?
          set -e
          cat c403-baseline-rejection.log
          test "$status" -ne 0 && test "$status" -ne 124
          grep -F 'exact Description checkpoint not restored' c403-baseline-rejection.log
          for file in c403-melonds-*.xwd; do mv "$file" "${file/c403-melonds-/c403-baseline-}"; done
          cp "$RUNNER_TEMP/c403-original.nds" "$RUNNER_TEMP/c403-under-test.nds"
      - name: Verify complete descriptions, exact resume and changed-source reset
        shell: bash
        run: |
          C403_DESCRIPTION_ONLY=1 C403_CHANGED_ROM="$RUNNER_TEMP/c403-changed.nds" xvfb-run -a -s '-screen 0 1024x768x24' timeout 480s \
            bash tests/run_c260_melonds_fat.sh "$RUNNER_TEMP/c403-under-test.nds" "$C260_APP_RUN"
      - name: Preserve synthetic-only entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c403-description-synthetic-evidence
          path: |
            c403-melonds-*.xwd
            c403-baseline-*.xwd
            c403-baseline-rejection.log
            c260-melonds-windows.txt
          if-no-files-found: ignore
          retention-days: 3
