name: Native BlocksDS build readiness
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'Makefile'
      - 'Makefile.native'
      - '.github/workflows/native-blocksds.yml'
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report native source readiness (nonfatal until migration is complete)
        run: |
          if make verify-source; then
            echo 'Native game source: migrated' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Native game source: INCOMPLETE. Continue the C14 source migration before attempting a ROM build.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Explain private asset requirement
        run: echo 'Native ROM construction requires user-supplied original NitroFS assets, which are intentionally not present on GitHub-hosted runners.' >> "$GITHUB_STEP_SUMMARY"
