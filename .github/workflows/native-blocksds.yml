name: Native BlocksDS development ROM
on:
  push:
    paths:
      - 'source/**'
      - 'Makefile'
      - 'Makefile.native'
      - '.github/workflows/native-blocksds.yml'
  workflow_dispatch:
jobs:
  native-dev-rom:
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile asset-free native development shell
        run: make dev-rom
      - name: Check output is a nonempty ROM
        run: test -s Pokedex3D_DS_BlocksDS.nds
      - uses: actions/upload-artifact@v4
        with:
          name: Pokedex3D-native-development-smoke-only
          path: Pokedex3D_DS_BlocksDS.nds
          retention-days: 7
