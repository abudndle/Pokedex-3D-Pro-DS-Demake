name: C283 private low-bpp and ETC1 candidates (synthetic)
on:
  push:
    branches:
      - main
      - 'c*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c283-low-bpp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-low-bpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Morton, nibble, ETC1, ETC1A4, source SHA and fail-closed archive gates
        run: |
          python3 -m py_compile tools/c283_private_low_bpp_candidates.py
          python3 -m unittest discover -s tests -p 'test_c283_private_low_bpp_candidates.py' -v
      - name: Protect private original game assets and reports
        run: |
          test ! -d Pokedex_3D_Pro_PRIVATE_workspace
          test ! -e C283_PRIVATE_LOW_BPP_C84_CANDIDATES.json
