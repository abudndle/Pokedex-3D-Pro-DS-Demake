name: C335 Nitro Engine and DSMA original-source bridge
on:
  push:
    branches:
      - main
      - 'feat/c335-*'
    paths:
      - 'source/nitro_source_bridge.*'
      - 'source/main.c'
      - 'Makefile.native'
      - 'tools/c335_*'
      - 'tests/c335_*'
      - 'tests/test_c335_*'
      - 'tests/run_c335_*'
      - '.github/workflows/c335-nitroengine-dsma.yml'
  pull_request:
    paths:
      - 'source/nitro_source_bridge.*'
      - 'source/main.c'
      - 'Makefile.native'
      - 'tools/c335_*'
      - 'tests/c335_*'
      - 'tests/test_c335_*'
      - 'tests/run_c335_*'
      - '.github/workflows/c335-nitroengine-dsma.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: c335-nitroengine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C335 real C manifest and DSMA bounds, host build
        run: sh tests/run_c335_nitro_bridge.sh
      - name: C335 native source conversion (synthetic P3VX/P3IX, no Nintendo data)
        run: python3 -m unittest discover -s tests -p 'test_c335_nitro_converter.py' -v
      - name: C335 no-replica and existing renderer ownership checks
        run: python3 -m unittest discover -s tests -p 'test_c335_native_bridge_wiring.py' -v
  native-nitro-engine:
    needs: source-preflight
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install published BlocksDS Nitro Engine (includes DSMA)
        run: |
          set -eu
          wf-pacman -Sy --noconfirm blocksds-nitroengine
          test -f /opt/blocksds/external/nitro-engine/include/NEMain.h
          test -f /opt/blocksds/external/nitro-engine/lib/libNE.a
      - name: Convert a synthetic verified source pair via upstream Nitro Engine obj2dl
        run: |
          python3 tests/c335_official_nitro_tool_smoke.py \
            /opt/blocksds/external/nitro-engine/tools/obj2dl/obj2dl.py
      - name: Build native ROM linked with actual Nitro Engine and DSMA
        run: |
          make -f Makefile.native P3D_NITRO_ENGINE=1 NITROFSDIR=nitrofs rom
          python3 tests/verify_nds_rom.py Pokedex3D_DS_BlocksDS.nds
      - name: Preserve optional Nitro Engine-linked asset-free ROM
        uses: actions/upload-artifact@v4
        with:
          name: c335-nitro-engine-dsma-asset-free-native-rom
          path: Pokedex3D_DS_BlocksDS.nds
          if-no-files-found: error
          retention-days: 3
