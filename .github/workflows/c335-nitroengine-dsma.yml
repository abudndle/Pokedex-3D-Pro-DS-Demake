name: C335 Nitro Engine and DSMA original-source bridge
on:
  push:
    branches:
      - main
      - 'feat/c335-*'
    paths:
      - 'source/nitro_source_bridge.*'
      - 'source/main.c'
      - 'Makefile.native'
      - 'tools/c335_*'
      - 'tests/c335_*'
      - 'tests/test_c335_*'
      - 'tests/run_c335_*'
      - '.github/workflows/c335-nitroengine-dsma.yml'
  pull_request:
    paths:
      - 'source/nitro_source_bridge.*'
      - 'source/main.c'
      - 'Makefile.native'
      - 'tools/c335_*'
      - 'tests/c335_*'
      - 'tests/test_c335_*'
      - 'tests/run_c335_*'
      - '.github/workflows/c335-nitroengine-dsma.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: c335-nitroengine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned upstream Nitro Engine conversion scripts (no models)
        uses: actions/checkout@v4
        with:
          repository: AntonioND/nitro-engine
          ref: a89917d908e49ab6df1c6762101c240a536bd308
          path: upstream-nitro-engine
          persist-credentials: false
      - name: C335 real C manifest and DSMA bounds, host build
        run: sh tests/run_c335_nitro_bridge.sh
      - name: C335 native source conversion (synthetic P3VX/P3IX, no Nintendo data)
        run: python3 -m unittest discover -s tests -p 'test_c335_nitro_converter.py' -v
      - name: C335 no-replica and existing renderer ownership checks
        run: python3 -m unittest discover -s tests -p 'test_c335_native_bridge_wiring.py' -v
      - name: C335 convert synthetic ordered source using actual pinned upstream obj2dl
        run: python3 tests/c335_official_nitro_tool_smoke.py upstream-nitro-engine/tools/obj2dl/obj2dl.py
  native-nitro-engine:
    needs: source-preflight
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install published BlocksDS Nitro Engine (includes DSMA)
        run: |
          set -eu
          wf-pacman -Sy --noconfirm blocksds-nitroengine
          # BlocksDS docs: external libraries reside at BLOCKSDSEXT,
          # e.g. /opt/wonderful/thirdparty/blocksds/external in the container.
          test -f "$BLOCKSDSEXT/nitro-engine/include/NEMain.h"
          test -f "$BLOCKSDSEXT/nitro-engine/lib/libNE.a"
          test -f "$BLOCKSDSEXT/nitro-engine/tools/obj2dl/obj2dl.py"
      - name: Build native ROM linked with actual Nitro Engine and DSMA
        run: |
          # No private Nintendo files exist in public CI; keep NitroFS empty.
          make -f Makefile.native P3D_NITRO_ENGINE=1 NITROFSDIR= rom
      - name: Preserve optional Nitro Engine-linked asset-free ROM
        uses: actions/upload-artifact@v4
        with:
          name: c335-nitro-engine-dsma-asset-free-native-rom
          path: Pokedex3D_DS_BlocksDS.nds
          if-no-files-found: error
          retention-days: 3
  emulator-linked-rom:
    needs: verify-linked-rom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c335-nitro-engine-dsma-asset-free-native-rom
      - name: Download official SHA-pinned melonDS 1.1
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          echo "C335_MELONDS_ROOT=$root" >> "$GITHUB_ENV"
          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/melonDS-emu/melonDS/releases/download/1.1/melonDS-1.1-appimage-x86_64.zip' \
            -o "$root/melonds.zip"
          printf '%s  %s\n' 'bf377420a2e95f2cd2cdda17d5372b51c2534f858b038db9ec6d129554875124' "$root/melonds.zip" | sha256sum -c -
          unzip -q "$root/melonds.zip" -d "$root"
          app="$(find "$root" -maxdepth 3 -type f -name '*.AppImage' -print -quit)"
          test -n "$app"
          chmod +x "$app"
          (cd "$root" && "$app" --appimage-extract >/dev/null)
          test -x "$root/squashfs-root/AppRun"
          echo "C335_APP_RUN=$root/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Install independent DS emulator UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-apps x11-utils xdotool libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Actual Nitro Engine-linked ROM boot, source-free Pokédex UI and controls
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' timeout 145s \
            bash tests/run_c253_melonds_smoke.sh \
            "$PWD/Pokedex3D_DS_BlocksDS.nds" "$C335_APP_RUN"
      - name: Preserve emulator screenshots, not private assets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c335-nitro-engine-linked-melonds-evidence
          path: |
            c253-melonds-*.xwd
            c254-melonds-*.xwd
            c255-melonds-*.xwd
            c256-melonds-*.xwd
            c257-melonds-*.xwd
            c258-melonds-*.xwd
            c259-melonds-*.xwd
            c253-melonds-windows.txt
          if-no-files-found: ignore
          retention-days: 3
  verify-linked-rom:
    needs: native-nitro-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: c335-nitro-engine-dsma-asset-free-native-rom
      - name: Independently verify Nitro Engine-linked ARM9/ARM7 ROM sections
        run: python3 tests/verify_nds_rom.py Pokedex3D_DS_BlocksDS.nds
