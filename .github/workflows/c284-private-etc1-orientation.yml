name: C284 private ETC1 vertical orientation candidates (synthetic)
on:
  push:
    branches:
      - main
      - 'c*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c284-etc1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-orientation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ETC1/ETC1A4 orientation and ambiguity with synthetic blocks
        run: |
          python3 -m py_compile tools/c284_private_etc1_orientation.py
          python3 -m unittest discover -s tests -p 'test_c284_private_etc1_orientation.py' -v
          python3 -m unittest discover -s tests -p 'test_c283_private_low_bpp_candidates.py' -v
      - name: Reject private Nintendo source and reports in public CI
        run: |
          test ! -d Pokedex_3D_Pro_PRIVATE_workspace
          test ! -e C284_PRIVATE_ETC1_ORIENTATION_CANDIDATES.json
