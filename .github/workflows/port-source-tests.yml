name: Port source tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run asset-free C source smoke test
        run: sh tests/run_source_smoke.sh
      - name: Validate private asset loader contracts
        run: python3 -m unittest discover -s tests -p 'test_asset_manifest.py' -v

      - name: Validate DS3M v1/v2 fixture contracts
        run: python3 -m unittest discover -s tests -p 'test_inspect_ds3m.py' -v

      - name: Verify alternate-form resource mapping and cycling
        run: sh tests/run_form_model_map.sh

      - name: Verify explicit species-to-model resource mapping
        run: sh tests/run_species_model_map.sh

      - name: Verify original geometry preview loader
        run: sh tests/run_preview_stream_fixture.sh

      - name: Verify touchscreen menu layout
        run: sh tests/run_menu_layout_smoke.sh

      - name: Verify DS and DSi feature availability
        run: sh tests/run_dsi_feature_gating.sh

      - name: Test recovered feature menu and type chart
        run: sh tests/run_feature_menu_smoke.sh

      - name: Verify save persistence and backup slots
        run: sh tests/run_save_store_smoke.sh

      - name: Verify corrupted and truncated save slot recovery
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isource tests/test_save_recovery.c source/save_store.c -o /tmp/p3d-save-recovery
          /tmp/p3d-save-recovery

      - name: Verify regional challenge quiz rules
        run: sh tests/run_challenge_smoke.sh

      - name: Verify original Move Dex catalog reader
        run: sh tests/run_move_dex_smoke.sh

      - name: Verify photo album browse and delete
        run: sh tests/run_photo_album_smoke.sh

      - name: Verify optional DS-mode image selection
        run: sh tests/run_custom_images.sh

      - name: Verify DS custom BMP decoding
        run: sh tests/run_bmp_loader.sh

      - name: Verify custom background runtime loading
        run: sh tests/run_image_background.sh

      - name: Verify DS Settings image touch selection
        run: sh tests/run_settings_images.sh

      - name: Verify native menu touchscreen row mapping
        run: sh tests/run_menu_navigation.sh

      - name: Verify native gameplay save conversion
        run: sh tests/run_game_save_bridge.sh

      - name: Validate private original UI packaging
        run: python3 tests/test_private_ui_packager.py
