name: Port source tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run asset-free C source smoke test
        run: sh tests/run_source_smoke.sh
      - name: Validate private asset loader contracts
        run: python3 -m unittest discover -s tests -p 'test_asset_manifest.py' -v

      - name: Verify original geometry preview loader
        run: sh tests/run_preview_stream_fixture.sh

      - name: Verify touchscreen menu layout
        run: sh tests/run_menu_layout_smoke.sh

      - name: Verify DS and DSi feature availability
        run: sh tests/run_dsi_feature_gating.sh

      - name: Test recovered feature menu and type chart
        run: sh tests/run_feature_menu_smoke.sh

      - name: Verify save persistence and backup slots
        run: sh tests/run_save_store_smoke.sh

      - name: Verify regional challenge quiz rules
        run: sh tests/run_challenge_smoke.sh

      - name: Verify original Move Dex catalog reader
        run: sh tests/run_move_dex_smoke.sh

      - name: Verify photo album browse and delete
        run: sh tests/run_photo_album_smoke.sh
