name: Port source tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run asset-free C source smoke test
        run: sh tests/run_source_smoke.sh
      - name: Validate private asset loader contracts
        run: python3 -m unittest discover -s tests -p 'test_asset_manifest.py' -v

      - name: Validate DS3M v1/v2 fixture contracts
        run: python3 -m unittest discover -s tests -p 'test_inspect_ds3m.py' -v

      - name: Verify C135 missing C56 preview recovery boundaries
        run: python3 -m unittest discover -s tests -p 'test_c135_missing_previews.py' -v

      - name: Verify C136 native DS3M header repair and exact UV paired opt-in
        run: python3 -m unittest discover -s tests -p 'test_c136_native_uv_stage.py' -v

      - name: Verify C137 private NitroFS preflight and staging safety
        run: python3 -m unittest discover -s tests -p 'test_c137_private_asset_integration.py' -v

      - name: Exercise C138 real native C preview loader for 730 synthetic models and UVs
        run: python3 -m unittest discover -s tests -p 'test_c138_native_preview_probe.py' -v

      - name: Verify C140 original source C5 shader declaration recovery
        run: python3 -m unittest discover -s tests -p 'test_c140_c5_shader_inventory.py' -v

      - name: Verify C141 original C5 source mesh boundaries and DS3M consistency
        run: python3 -m unittest discover -s tests -p 'test_c141_c5_mesh_provenance.py' -v

      - name: Verify C142 original C5 track table and fast summary audit
        run: python3 -m unittest discover -s tests -p 'test_c142_c5_track_index.py' -v

      - name: Verify C143 original C5 repeating channel candidate groups
        run: python3 -m unittest discover -s tests -p 'test_c143_c5_channel_groups.py' -v

      - name: Verify C144 original time-indexed float3 source data recovery
        run: python3 -m unittest discover -s tests -p 'test_c144_c5_timed_vectors.py' -v

      - name: Verify C145 source packed quaternion-like animation keys
        run: python3 -m unittest discover -s tests -p 'test_c145_c5_packed_quaternions.py' -v

      # Public-source x86_64 host executable only. NO private Nintendo data.
      - name: Compile portable C138 host probe for private offline asset test
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -DC7_TEST_HOST \
            -Itools/host_stub -Isource source/preview_stream.c \
            source/preview_chunk_stream.c source/model_uv.c \
            tests/c138_native_preview_probe.c -o c138-native-preview-probe
      - name: Retain offline C138 host probe (no game assets)
        uses: actions/upload-artifact@v4
        with:
          name: c138-native-preview-probe-linux-x64
          path: c138-native-preview-probe
          if-no-files-found: error
          retention-days: 2

      - name: Verify material-to-texture cross-references
        run: sh tests/run_model_material_texture.sh

      - name: C139 fail-closed source texture face and normalized UV draw guard
        run: sh tests/run_c109_original_material_refs.sh

      - name: Verify VRAM-bounded multi-material texture rendering assets
        run: sh tests/run_preview_texture_set.sh

      - name: Verify DS texture upload interface
        run: sh tests/run_ds_texture_upload.sh

      - name: Verify RGB555 texture payload against manifest
        run: sh tests/run_texture_asset.sh

      - name: Verify local-only RGB555 texture pixel files
        run: sh tests/run_texture_pixels.sh

      - name: Validate per-model original UV-coordinate transport
        run: sh tests/run_model_uv.sh

      - name: Validate private texture reference metadata
        run: sh tests/run_model_textures.sh

      - name: Validate bounded model material ranges
        run: sh tests/run_model_materials.sh

      - name: Verify optional multi-clip animation discovery and switching
        run: sh tests/run_model_animation_library.sh

      - name: Verify model transform animation clips
        run: sh tests/run_model_animation.sh

      - name: Verify optional original form names
        run: sh tests/run_form_names.sh

      - name: Verify alternate-form resource mapping and cycling
        run: sh tests/run_form_model_map.sh

      - name: Verify explicit species-to-model resource mapping
        run: sh tests/run_species_model_map.sh

      - name: Verify original geometry preview loader
        run: sh tests/run_preview_stream_fixture.sh

      - name: Verify touchscreen menu layout
        run: sh tests/run_menu_layout_smoke.sh

      - name: Verify DS and DSi feature availability
        run: sh tests/run_dsi_feature_gating.sh

      - name: Test recovered feature menu and type chart
        run: sh tests/run_feature_menu_smoke.sh

      - name: Verify save persistence and backup slots
        run: sh tests/run_save_store_smoke.sh

      - name: Verify corrupted and truncated save slot recovery
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isource tests/test_save_recovery.c source/save_store.c -o /tmp/p3d-save-recovery
          /tmp/p3d-save-recovery

      - name: Verify regional challenge quiz rules
        run: sh tests/run_challenge_smoke.sh

      - name: Verify original Move Dex catalog reader
        run: sh tests/run_move_dex_smoke.sh

      - name: Verify photo album browse and delete
        run: sh tests/run_photo_album_smoke.sh

      - name: Verify optional DS-mode image selection
        run: sh tests/run_custom_images.sh

      - name: Verify DS custom BMP decoding
        run: sh tests/run_bmp_loader.sh

      - name: Verify custom background runtime loading
        run: sh tests/run_image_background.sh

      - name: Verify DS Settings image touch selection
        run: sh tests/run_settings_images.sh

      - name: Verify native menu touchscreen row mapping
        run: sh tests/run_menu_navigation.sh

      - name: Verify native gameplay save conversion
        run: sh tests/run_game_save_bridge.sh

      - name: Validate private original UI packaging
        run: python3 tests/test_private_ui_packager.py
